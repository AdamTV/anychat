# Weekly flaky-test detection: runs the suite, retries every failure, and
# reports tests that pass on retry. Non-blocking (continue-on-error) so
# detection never gates merges; the report lands in the step summary and in
# the flaky-test-report artifact. Run locally with `npm run check:flaky`.
name: Flaky Test Detection

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flaky-test-detection
  cancel-in-progress: false

jobs:
  detect-flaky-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the SDK version the pubspec.lock was resolved with
          # (pubspec caps the Dart SDK at <3.19.0).
          flutter-version: '3.19.6'
      - name: Install dependencies
        run: flutter pub get
      - name: Detect flaky tests
        run: node scritps/flaky_test_detector.js
      - name: Flaky test report
        if: always()
        run: |
          if [ -f test-results/flaky-report.md ]; then
            cat test-results/flaky-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload flaky test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flaky-test-report
          path: |
            test-results/flaky-report.json
            test-results/flaky-report.md
          retention-days: 90
