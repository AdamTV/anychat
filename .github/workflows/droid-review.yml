# Automated PR review powered by Factory Droid: posts code review and
# security review comments on every pull request.
#
# Setup required before reviews can be posted:
#   1. Generate a Factory API key at https://app.factory.ai/settings/api-keys
#   2. Add it as a repository secret named FACTORY_API_KEY
#      (Settings > Secrets and variables > Actions > New repository secret)
name: Droid Auto Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  droid-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: Run Droid Auto Review
        uses: Factory-AI/droid-action@main
        with:
          factory_api_key: ${{ secrets.FACTORY_API_KEY }}
          automatic_review: true
          allowed_bots: factory-droid
          automatic_security_review: true
